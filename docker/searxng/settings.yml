# SearXNG settings for Livemap

use_default_settings: true

server:
  secret_key: "livemap-searxng-secret-key-change-in-production"
  limiter: false  # Disable rate limiting for local use
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json  # Enable JSON API

# Enable specific search engines
engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: google news
    engine: google_news
    shortcut: gn
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: bing news
    engine: bing_news
    shortcut: bn
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false

# Outgoing requests
outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
