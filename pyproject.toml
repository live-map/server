[project]
name = "backend"
version = "0.1.0"
description = "Grapoll backend - 여론조사 플랫폼 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.0",
    # Production utilities
    "tenacity>=8.2.0", # Retry with exponential backoff
    # JWT Authentication (NextAuth JWE decryption)
    "fastapi-nextauth-jwt>=0.2.4", # Decode NextAuth JWE tokens
    # AWS S3 (for media uploads)
    "boto3>=1.34.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # AI Research Agent
    "langgraph>=0.4.0,<0.5",
    "langchain-anthropic>=0.3.0,<0.5",
    "langchain-openai>=0.3.0,<0.5",
    "tavily-python>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
