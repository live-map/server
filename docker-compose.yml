# Livemap Backend - Production Docker Compose
# For Oracle Cloud Free Tier (ARM64)

services:
  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: livemap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: livemap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-livemap123}
      POSTGRES_DB: livemap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livemap -d livemap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SearXNG - Self-hosted search engine (FREE)
  searxng:
    image: searxng/searxng:latest
    container_name: livemap-searxng
    restart: unless-stopped
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-in-production}

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livemap-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://livemap:${DB_PASSWORD:-livemap123}@db:5432/livemap
      # SearXNG
      SEARXNG_URL: http://searxng:8080
      ENABLE_RAG_STAGE2: "true"
      # Telegram
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      # API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # App settings
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    volumes:
      - model_cache:/root/.cache
      - telegram_session:/app/sessions

volumes:
  postgres_data:
  model_cache:
  telegram_session:
