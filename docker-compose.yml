# Livemap Backend - Production Docker Compose
# Autonomous Agent System

services:
  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: livemap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: livemap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-livemap123}
      POSTGRES_DB: livemap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livemap -d livemap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livemap-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://livemap:${DB_PASSWORD:-livemap123}@db:5432/livemap
      # Telegram
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      # API Keys
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # Autonomous Agent
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      AGENT_TAVILY_API_KEY: ${AGENT_TAVILY_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gpt-4o-mini}
      # App settings
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - telegram_session:/app/sessions

volumes:
  postgres_data:
  model_cache:
  telegram_session:
