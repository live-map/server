name: Deploy Backend

on:
  push:
    branches: [dev]
    paths:
      - "app/**"
      - "alembic/**"
      - "Dockerfile"
      - "fly.toml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
